<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src *; media-src *" />
  <title>RemoteDesk Host</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0c10; --bg2: #111318; --bg3: #181b22;
      --border: #1e2330; --accent: #3b82f6; --text: #e2e8f0;
      --dim: #64748b; --mute: #334155; --green: #22c55e;
      --yellow: #f59e0b; --red: #ef4444;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; user-select: none; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; margin-bottom: 28px; letter-spacing: -0.5px; }
    .logo-icon { color: var(--accent); font-size: 26px; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
    .status-row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex-shrink: 0; }
    .dot.connecting { background: var(--yellow); animation: blink 1s infinite; }
    .dot.connected { background: var(--green); }
    .dot.error { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .status-text { font-size: 13px; color: var(--dim); font-weight: 600; }
    .session-box { background: var(--bg3); border: 1px solid var(--accent); border-radius: 8px; padding: 14px 16px; text-align: center; }
    .session-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
    .session-id { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 3px; color: var(--accent); }
    .session-hint { font-size: 11px; color: var(--dim); margin-top: 6px; }
    .info-row { font-size: 11px; color: var(--mute); display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { background: var(--bg3); border: 1px solid var(--border); border-radius: 100px; padding: 3px 10px; }
    .empty-session { text-align: center; color: var(--mute); font-size: 13px; padding: 8px 0; }
    .error-box { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--red); }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">⚡</span> RemoteDesk
  </div>

  <div class="card">
    <div class="status-row">
      <div class="dot" id="dot"></div>
      <span class="status-text" id="status-text">Starting…</span>
    </div>

    <div id="session-section" class="empty-session">Connecting to server…</div>

    <div class="info-row" id="info-row"></div>

    <div id="error-box" class="error-box" style="display:none"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
